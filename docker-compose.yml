# Laptop only. DevOps does not use this repo — they build myboss-backend and myboss-admin Dockerfiles.
# Two containers: employee API (:3001) and admin UI (:8081).
# Admin image has no build args; VITE_API_URL is injected at container runtime.

services:
  api:
    build:
      context: ../myboss-backend
      dockerfile: docker/Dockerfile
    container_name: myboss-api
    restart: unless-stopped
    ports: ['3001:3001']
    env_file: [.env]
    environment:
      PORT: ${PORT:-3001}
      API_INTERNAL_URL: http://127.0.0.1:3001/api/v1
      FCM_SERVICE_ACCOUNT_PATH: /run/secrets/fcm-service-account.json
      DEMO_DEVICE_TOKENS_FILE: /app/data/demo-device-tokens.json
      DEMO_GALLERY_FILE: /app/data/demo-gallery.json
      DEMO_NOTIFICATIONS_FILE: /app/data/demo-notifications.json
      DEMO_GALLERY_TZ: Asia/Amman
    volumes:
      - myboss-data:/app/data
      - ./secrets:/run/secrets:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'preprod-notification.xyz.jt.jtgroup:10.1.112.95'

  admin:
    build:
      context: ../myboss-admin
      dockerfile: docker/Dockerfile
    container_name: myboss-admin
    restart: unless-stopped
    ports: ['8081:80']
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:3001/api/v1}
      VITE_APP_ENV: ${VITE_APP_ENV:-development}

volumes:
  myboss-data:
