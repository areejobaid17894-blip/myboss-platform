# Two containers only: employee API (:3001) and admin UI (:8081).
# Env: copy .env.development.example | .env.production.example | .env.preprod.example → .env
# Run from this directory (siblings: ../myboss-backend, ../myboss-admin).
# Secrets: never commit .env. DevOps CI/CD injects the same keys.

services:
  api:
    build:
      context: ../myboss-backend
      dockerfile: docker/Dockerfile
    container_name: myboss-api
    restart: unless-stopped
    ports: ['3001:3001']
    env_file: [.env]
    environment:
      PORT: ${PORT:-3001}
      API_INTERNAL_URL: http://127.0.0.1:3001/api/v1
      FCM_SERVICE_ACCOUNT_PATH: /run/secrets/fcm-service-account.json
      DEMO_DEVICE_TOKENS_FILE: /app/data/demo-device-tokens.json
      DEMO_GALLERY_FILE: /app/data/demo-gallery.json
      DEMO_NOTIFICATIONS_FILE: /app/data/demo-notifications.json
      DEMO_GALLERY_TZ: Asia/Amman
    volumes:
      - myboss-data:/app/data
      # Mount the folder (not the JSON path). Binding a missing file makes Docker
      # create a directory named fcm-service-account.json, which breaks FCM.
      - ./secrets:/run/secrets:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'preprod-notification.xyz.jt.jtgroup:10.1.112.95'

  admin:
    build:
      context: ../myboss-admin
      dockerfile: docker/Dockerfile
      args:
        BUILD_MODE: ${ADMIN_BUILD_MODE:-demo}
        DEMO_HOST: ${DEMO_HOST:-127.0.0.1}
        VITE_APP_ENV: ${VITE_APP_ENV:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_GATEWAY_ORIGIN: ${VITE_API_GATEWAY_ORIGIN:-}
    container_name: myboss-admin
    restart: unless-stopped
    ports: ['8081:80']

volumes:
  myboss-data:
