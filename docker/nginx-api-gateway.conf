# Demo API gateway — single entry point (Apigee-style paths).
# Mobile: https://HOST/auth/api/v1, /user/api/v1, ...
# resolver + resolve: re-resolve Docker service names when containers restart.

resolver 127.0.0.11 valid=10s ipv6=off;

upstream auth_upstream {
    zone auth_upstream 64k;
    server auth-service:3001 resolve;
}

upstream user_upstream {
    zone user_upstream 64k;
    server user-service:3002 resolve;
}

upstream config_upstream {
    zone config_upstream 64k;
    server config-service:3003 resolve;
}

upstream squad_upstream {
    zone squad_upstream 64k;
    server squad-service:3004 resolve;
}

upstream survey_upstream {
    zone survey_upstream 64k;
    server survey-service:3005 resolve;
}

upstream admin_upstream {
    zone admin_upstream 64k;
    server admin-portal:80 resolve;
}

server {
    listen 8090;
    server_name _;

    client_max_body_size 25m;

    location /auth/ {
        proxy_pass http://auth_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /user/ {
        proxy_pass http://user_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /config/ {
        proxy_pass http://config_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /squad/ {
        proxy_pass http://squad_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /survey/ {
        proxy_pass http://survey_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Flutter mobile web (demo testing) — build with --base-href=/app/
    location = /app/login {
        return 302 /app/sign-in;
    }

    location /app/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Admin portal UI (same port as mobile API — works via LAN + Cloudflare tunnel)
    location / {
        proxy_pass http://admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
